    },
    "Заявка по шаблону ОПС": {
        "положительно": "",
        "отрицательно": "",
        "is_last": True,
        "if_comment": "Вам необходимо оформить заявку по шаблону;Наш офис - Здание, помещение - Сигнализация - Установка дополнительного оборудования охранно-пожарной сигнализации (ОПС)",
        "is_resolved": False,
    },
    "Иные неисправности СОТС": {
        "положительно": "",
        "отрицательно": "",
        "is_last": True,
        "if_comment": None,
        "is_resolved": False,
    },
    "Объект не ставится под охрану": {
        "положительно": "",
